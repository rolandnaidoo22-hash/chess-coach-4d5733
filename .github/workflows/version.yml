# Keeps the ?v= numbers on script tags and the service-worker cache name in step with the files (see tools/bump-version.py).
name: bump-version
on:
  push:
    branches: [gh-pages]
    paths-ignore: ["sw.js", "tests/**", "tools/**", ".github/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/bump-version.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || (git commit -m "Auto-bump cache version" && git push)
