# Copy this file to .github/workflows/champion-book.yml to enable it.
# Creating or updating files under .github/workflows/ needs a GitHub token
# with the `workflow` scope; the preview push token does not have that
# scope, so the YAML lives here until someone with access copies it.
#
# Rebuild the Champion opening book from public monthly chess archives.
#
# How updates work
# ----------------
# 1. Preferred: this workflow, every 3 days (and on workflow_dispatch).
#    It fetches recent monthly archives politely (User-Agent, ~1.1s pacing,
#    429 backoff), rebuilds champion-book.json, and commits it back to the
#    same branch that ran the workflow.
# 2. The app also has an in-app fallback: if the bundled book is older than
#    3 days and the phone is online, it may fetch the latest 1–2 months in
#    a background worker and merge them, using the same mobile-data consent
#    pattern as Opponent Brain.
#
# Scheduled workflows ONLY run from the repository default branch. Today
# that default branch is gh-pages (the live app). This file is added on
# champion-bot so the cron will NOT fire by itself and will NOT update live.
# After Prishen approves the Champion feature, activating the schedule
# means putting this workflow file on the default branch — which should
# happen only as part of an approved go-live, not by this workflow pushing
# there on its own.
#
# Meanwhile, workflow_dispatch can be run from the Actions tab on this
# branch to rebuild the book without waiting for a merge.
#
# This job never checks out, commits to, or pushes gh-pages or main.

name: Update Champion book

on:
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.ref != 'refs/heads/gh-pages' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install chess
      - name: Rebuild book
        env:
          CHAMPION_ARCHIVE_PLAYER: magnuscarlsen
          CHAMPION_BOOK_MONTHS: "24"
          CHAMPION_BOOK_DEPTH: "14"
        run: python tools/build-champion-book.py
      - name: Commit if the book changed
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "gh-pages" ] || [ "$branch" = "main" ]; then
            echo "Refusing to write to $branch"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champion-book.json
          if git diff --cached --quiet; then
            echo "Book unchanged"
            exit 0
          fi
          git commit -m "Update Champion opening book."
          git push origin "HEAD:${branch}"
